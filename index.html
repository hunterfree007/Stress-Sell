<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress &amp; Sell PC - PC assemblati e testati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        @keyframes modalShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); }
            40%, 80% { transform: translateX(7px); }
        }
        .animate-shake {
            animation: modalShake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300 antialiased" id="appBody">

    <!-- HEADER / NAVIGATION BAR -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('catalog')">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-desktop text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">Stress &amp; Sell</span>
                    <span class="text-xs uppercase font-semibold text-cyan-400 block tracking-widest -mt-1">PC assemblati e testati</span>
                </div>
            </div>

            <!-- Navigation Actions & Controls -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <!-- Toggle Mode Button (Catalog / Admin Dashboard) -->
                <button id="viewToggleBtn" onclick="toggleMainView()" class="px-4 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 flex items-center space-x-2 bg-gradient-to-r from-cyan-500 to-indigo-600 text-white hover:opacity-95 shadow-md shadow-cyan-500/10">
                    <i id="viewToggleIcon" class="fa-solid fa-lock"></i>
                    <span id="viewToggleText" class="hidden sm:inline">Pannello Gestione Admin</span>
                </button>

                <!-- Dark/Light Theme Toggle -->
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors border border-slate-700/60" title="Cambia Tema">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ========================================== -->
        <!-- VIEW 1: CATALOGO / VETRINA PUBBLICA        -->
        <!-- ========================================== -->
        <section id="catalogView" class="space-y-8">
            <!-- Hero Banner -->
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-slate-800 p-8 sm:p-12 shadow-2xl">
                <div class="absolute -right-10 -bottom-10 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -left-10 -top-10 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="relative z-10 max-w-3xl space-y-4">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                        <i id="heroBadgeIcon" class="fa-solid fa-bolt text-xs"></i> <span id="heroBadgeText">Pronta consegna</span>
                    </span>
                    <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">
                        <span id="heroTitleWhite">Li costruisco, li testo</span> <span id="heroTitleColor" class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">e poi li vendo</span>
                    </h1>
                    <p id="heroIntro" class="text-slate-400 text-sm sm:text-base leading-relaxed"></p>
                    <p class="text-xs text-slate-500 flex flex-wrap items-center gap-x-1.5 gap-y-1">
                        <i class="fa-solid fa-truck-fast"></i>
                        <span id="heroShipping"></span>
                        <a id="subitoHeroLink" href="#" target="_blank" rel="noopener" class="hidden text-cyan-400 hover:underline font-semibold">Guarda le mie recensioni su Subito</a>
                    </p>
                </div>
            </div>

            <!-- Search, Filter & Sorting Bar -->
            <div class="p-4 rounded-2xl glass-card flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- Search Box -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cerca CPU, GPU, titolo..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm focus:outline-none focus:border-cyan-500 transition-colors placeholder-slate-500 text-white">
                </div>

                <!-- Filters & Sort -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                    <!-- Condition Filter -->
                    <select id="statusFilter" onchange="applyFilters()" class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-200">
                        <option value="ALL">Tutti gli stati</option>
                        <option value="Nuovo">Nuovo</option>
                        <option value="Usato Garantito">Usato Garantito</option>
                        <option value="Ricondizionato">Ricondizionato</option>
                    </select>

                    <!-- Price Range Filter -->
                    <select id="priceFilter" onchange="applyFilters()" class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-200">
                        <option value="ALL">Qualsiasi prezzo</option>
                        <option value="0-800">Fino a €800</option>
                        <option value="800-1500">€800 - €1.500</option>
                        <option value="1500-2500">€1.500 - €2.500</option>
                        <option value="2500+">Oltre €2.500</option>
                    </select>

                    <!-- Sort -->
                    <select id="sortBy" onchange="applyFilters()" class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500 text-slate-200">
                        <option value="newest">Più recenti</option>
                        <option value="price-asc">Prezzo: Crescente</option>
                        <option value="price-desc">Prezzo: Decrescente</option>
                    </select>
                </div>
            </div>

            <!-- Active Listings Count -->
            <div class="flex justify-between items-center px-1">
                <span id="listingsCount" class="text-slate-400 text-sm font-medium">Caricamento annunci...</span>
            </div>

            <!-- Listings Grid -->
            <div id="pcGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically Populated Cards -->
            </div>

            <!-- Empty State -->
            <div id="emptyCatalogState" class="hidden text-center py-16 bg-slate-900/40 rounded-3xl border border-dashed border-slate-800">
                <i class="fa-solid fa-desktop text-5xl text-slate-600 mb-4 block"></i>
                <h3 class="text-lg font-bold text-slate-300">Nessun PC Trovato</h3>
                <p class="text-slate-500 text-sm mt-1">Nessun annuncio corrisponde ai criteri di ricerca impostati.</p>
                <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-slate-800 text-cyan-400 rounded-xl text-sm font-medium hover:bg-slate-700 transition-colors">Ripristina Filtri</button>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- VIEW 2: DASHBOARD ADMIN & EDITING FORM     -->
        <!-- ========================================== -->
